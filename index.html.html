<!DOCTYPE html>
<html lang="th">
<head>
<style>
*{
   box-sizing: border-box;
   margin: 0;
   padding: 0;
}
.box{width:1024px;margin:0 auto;}
header{
background-image:url(images/header.jpg);
height:200px;
}
nav{background-color:yellow;height:400px;flex:1}
article{background-color:blue;height:400px;flex:4}
footer{background-color:purple;height:100px;}
section{display:flex;}

a:link{
       color:green;
       text-decoration:none;
       background-color:yellow;
       display:block;
       width:100%;
       padding:10px;
}
a:visited{
       color:red;
       text-decoration:none;
       background-color:transparent;
{
a:hover{
       color:pink;
       text-decoration:none;
       background-color:purple;
{
a:active{
       color:blue;
       text-decoration:none;
       background-color:transparent;
{

</style>
<meta charset="utf-8">
<title>work08 html layout</title>
</head>
<body>
<div class="box">
<header></header>
<section>
<nav>
<ul style="list-style-type:none">
<li><a href="#">มะม่วง</a></li>
<li><a href="#">มะนาว</a></li>
<li><a href="#">มะพร้าว</a></li>
<li><a href="#">ส้มโอ</a></li>
</ul>
</nav>
<article></article>
</section>
<footer></footer>
</div>
</body>
</html>
